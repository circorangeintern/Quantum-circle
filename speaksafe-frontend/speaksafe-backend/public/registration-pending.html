<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Submitted - SpeakSafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/auth-pages.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <img
            src="https://res.cloudinary.com/arlksjrh/image/upload/v1785392817/speaksafe-logo_ili6ey.png"
            alt="SpeakSafe Logo"
          />
        </div>

        <div class="success-icon">
          <div class="circle pending">⏳</div>
        </div>

        <h1 class="auth-title">Registration Submitted</h1>
        <p class="auth-subtitle">
          Your school registration request has been received and is pending
          review.
        </p>

        <div
          style="
            background: var(--amber-light);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 20px;
          "
        >
          <p
            style="
              font-size: 12px;
              color: #8b6b1e;
              font-weight: 500;
              margin: 0;
              text-align: center;
            "
          >
            ⏱️ A SpeakSafe system administrator will review your request shortly
          </p>
        </div>

        <div style="text-align: center; margin-bottom: 24px">
          <p
            style="font-size: 13px; color: var(--text-muted); line-height: 1.6"
          >
            You will receive an email once your registration has been reviewed
            and approved.
          </p>
        </div>

        <a
          href="https://speaksafe-t6ko.onrender.com"
          class="btn"
          style="
            text-decoration: none;
            text-align: center;
            display: block;
            background: var(--navy);
          "
        >
          Return to Home
        </a>

        <div class="auth-footer">
          <a href="https://speaksafe-t6ko.onrender.com/login">
            Already have an account? Login
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
