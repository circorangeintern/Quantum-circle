<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - SpeakSafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/auth-pages.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <img
            src="https://res.cloudinary.com/arlksjrh/image/upload/v1785392817/speaksafe-logo_ili6ey.png"
            alt="SpeakSafe Logo"
          />
        </div>

        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">
          Enter the email address associated with your account and we'll send
          you a link to reset your password.
        </p>

        <div id="messageBox" class="message-box"></div>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="you@school.edu"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Send Reset Link</span>
          </button>
        </form>

        <!-- Success State (shown after email sent) -->
        <div id="successState" style="display: none; margin-top: 20px">
          <div
            style="
              text-align: center;
              padding: 12px;
              background: var(--green-light);
              border-radius: var(--radius-sm);
            "
          >
            <p style="color: var(--green); font-weight: 600; margin: 0">
              ✅ Password reset link sent!
            </p>
            <p
              style="color: var(--text-muted); font-size: 13px; margin: 8px 0 0"
            >
              If an account exists with this email, you will receive a password
              reset link shortly.
            </p>
          </div>
        </div>

        <div class="auth-footer">
          <a href="/login">Back to Login</a>
        </div>
      </div>
    </div>

    <script src="./js/forgot-password.js"></script>
  </body>
</html>
