<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Successful - SpeakSafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/auth-pages.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <img
            src="https://res.cloudinary.com/arlksjrh/image/upload/v1785392817/speaksafe-logo_ili6ey.png"
            alt="SpeakSafe Logo"
          />
        </div>

        <div class="success-icon">
          <div class="circle">✓</div>
        </div>

        <h1 class="auth-title">Registration Complete!</h1>
        <p class="auth-subtitle">
          Your SpeakSafe authority account has been created. You can now log in
          to start managing reports.
        </p>

        <p
          style="
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
          "
        >
          A confirmation email has been sent to your registered email address
          with your temporary password.
        </p>

        <div
          style="
            background: var(--peri-light);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 24px;
          "
        >
          <p
            style="
              font-size: 12px;
              color: var(--blue-dark);
              font-weight: 500;
              margin: 0;
              text-align: center;
            "
          >
            🔐 Please check your email for login credentials
          </p>
        </div>

        <a
          href="https://speaksafe-t6ko.onrender.com/login"
          class="btn"
          style="text-decoration: none; text-align: center; display: block"
        >
          Go to Login
        </a>

        <div class="auth-footer">
          <a href="https://speaksafe-t6ko.onrender.com">Back to Home</a>
        </div>
      </div>
    </div>
  </body>
</html>
